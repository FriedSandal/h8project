<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBoard – Task & Project Kanban</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              900: '#0f1117', 800: '#161b27', 700: '#1e2535',
              600: '#253047', 500: '#2d3a54', 400: '#3d4e6e', 300: '#5a6e93',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-[#0f1117] text-slate-100 min-h-screen">

  <!-- ═══════ HEADER ═══════ -->
  <header class="app-header sticky top-0 z-50 px-5 py-3 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 min-w-0">
      <div class="brand-logo">SB</div>
      <span class="font-semibold text-[15px] tracking-tight text-slate-100 hidden sm:block">SmartBoard</span>
      <span id="projectName" class="project-name hidden md:block">Alpha Sprint</span>
    </div>

    <div class="flex items-center gap-2 flex-shrink-0">
      <!-- Search -->
      <div class="search-box hidden sm:block">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input id="searchInput" type="text" placeholder="Search tasks…" class="search-input" />
      </div>

      <!-- Theme toggle -->
      <button id="themeToggle" class="btn-icon" title="Toggle theme">
        <svg id="moonIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 1 0 9.79 9.79z"/>
        </svg>
        <svg id="sunIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="5" stroke-width="2"/>
          <path stroke-linecap="round" stroke-width="2" d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>

      <!-- Analytics toggle -->
      <button id="toggleAnalytics" class="btn-secondary">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M9 19v-6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2zm0 0V9a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v10m-6 0a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2m0 0V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v14a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2"/>
        </svg>
        <span class="hidden sm:inline">Analytics</span>
      </button>

      <!-- Add Task -->
      <button id="openAddTask" class="btn-primary">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 5v14M5 12h14"/>
        </svg>
        <span class="hidden sm:inline">Add Task</span>
      </button>
    </div>
  </header>

  <!-- ═══════ FILTER BAR ═══════ -->
  <div class="filter-bar">
    <span class="filter-label">Filter</span>

    <select id="filterPriority" class="filter-select">
      <option value="">All Priorities</option>
      <option value="critical">🔴 Critical</option>
      <option value="high">🟠 High</option>
      <option value="medium">🟡 Medium</option>
      <option value="low">🟢 Low</option>
    </select>

    <select id="filterCategory" class="filter-select">
      <option value="">All Categories</option>
      <option value="frontend">Frontend</option>
      <option value="backend">Backend</option>
      <option value="design">Design</option>
      <option value="devops">DevOps</option>
      <option value="qa">QA</option>
    </select>

    <select id="filterMember" class="filter-select">
      <option value="">All Members</option>
    </select>

    <select id="sortBy" class="filter-select">
      <option value="priority">↑ Priority</option>
      <option value="deadline">📅 Deadline</option>
      <option value="created">🕐 Created</option>
      <option value="title">🔤 Title</option>
    </select>

    <button id="clearFilters" class="text-xs text-indigo-400 hover:text-indigo-300 transition ml-auto font-medium">
      Clear all
    </button>
  </div>

  <!-- ═══════ ANALYTICS PANEL ═══════ -->
  <div id="analyticsPanel" class="analytics-panel hidden">
    <div class="max-w-6xl mx-auto">
      <!-- Stat counters -->
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-5">
        <div class="stat-card">
          <div class="stat-value" id="statTotal">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
        <div class="stat-card">
          <div class="stat-value text-emerald-400" id="statDone">0</div>
          <div class="stat-label">Completed</div>
        </div>
        <div class="stat-card">
          <div class="stat-value text-amber-400" id="statInProgress">0</div>
          <div class="stat-label">In Progress</div>
        </div>
        <div class="stat-card">
          <div class="stat-value text-rose-400" id="statOverdue">0</div>
          <div class="stat-label">Overdue</div>
        </div>
      </div>
      <!-- Charts -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <div class="chart-card">
          <div class="chart-title">Task Status</div>
          <div class="chart-wrap"><canvas id="statusChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">Priority Breakdown</div>
          <div class="chart-wrap"><canvas id="priorityChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">By Category</div>
          <div class="chart-wrap"><canvas id="categoryChart"></canvas></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ═══════ KANBAN BOARD ═══════ -->
  <main class="board-bg p-6 overflow-x-auto">
    <div id="kanbanBoard" class="flex gap-4 min-w-max pb-8"></div>
  </main>

  <!-- ═══════ ADD / EDIT TASK MODAL ═══════ -->
  <div id="taskModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title">
        <span id="modalTitle">New Task</span>
        <button id="closeModal" class="modal-close-btn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form id="taskForm" class="space-y-4">
        <input type="hidden" id="taskId" />

        <div>
          <label class="form-label">Title *</label>
          <input id="taskTitle" type="text" required class="form-input" placeholder="What needs to be done?" />
        </div>

        <div>
          <label class="form-label">Description</label>
          <textarea id="taskDesc" rows="2" class="form-input resize-none" placeholder="Optional details…"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Priority</label>
            <input type="hidden" id="taskPriority" value="medium" />
            <div class="custom-select" id="priorityDropdown">
              <button type="button" class="custom-select-trigger" id="priorityTrigger">
                <span id="priorityLabel">Medium</span>
                <svg class="custom-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>
              <div class="custom-select-menu" id="priorityMenu">
                <div class="custom-select-option" data-value="critical">
                  <span class="cso-dot" style="background:#f87171"></span>Critical
                </div>
                <div class="custom-select-option" data-value="high">
                  <span class="cso-dot" style="background:#fb923c"></span>High
                </div>
                <div class="custom-select-option selected" data-value="medium">
                  <span class="cso-dot" style="background:#facc15"></span>Medium
                </div>
                <div class="custom-select-option" data-value="low">
                  <span class="cso-dot" style="background:#4ade80"></span>Low
                </div>
              </div>
            </div>
          </div>
          <div>
            <label class="form-label">Category</label>
            <input type="hidden" id="taskCategory" value="frontend" />
            <div class="custom-select" id="categoryDropdown">
              <button type="button" class="custom-select-trigger" id="categoryTrigger">
                <span id="categoryLabel">Frontend</span>
                <svg class="custom-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
              </button>
              <div class="custom-select-menu" id="categoryMenu">
                <div class="custom-select-option selected" data-value="frontend">
                  <span class="cso-dot" style="background:#a78bfa"></span>Frontend
                </div>
                <div class="custom-select-option" data-value="backend">
                  <span class="cso-dot" style="background:#60a5fa"></span>Backend
                </div>
                <div class="custom-select-option" data-value="design">
                  <span class="cso-dot" style="background:#f472b6"></span>Design
                </div>
                <div class="custom-select-option" data-value="devops">
                  <span class="cso-dot" style="background:#2dd4bf"></span>DevOps
                </div>
                <div class="custom-select-option" data-value="qa">
                  <span class="cso-dot" style="background:#a3e635"></span>QA
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="form-label">Deadline</label>
            <input id="taskDeadline" type="date" class="form-input" />
          </div>
          <div>
            <label class="form-label">Assignee</label>
            <input id="taskAssignee" type="text" class="form-input" placeholder="Name or initials" />
          </div>
        </div>

        <div>
          <label class="form-label">Column</label>
          <input type="hidden" id="taskColumn" value="" />
          <div class="custom-select" id="columnDropdown">
            <button type="button" class="custom-select-trigger" id="columnTrigger">
              <span id="columnLabel">Select column…</span>
              <svg class="custom-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div class="custom-select-menu" id="columnMenu"></div>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-1">
          <button type="button" id="cancelModal" class="btn-cancel">Cancel</button>
          <button type="submit" class="btn-save">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ═══════ CONFIRM DELETE MODAL ═══════ -->
  <div id="confirmModal" class="modal-overlay hidden">
    <div class="modal-box" style="max-width:360px">
      <div class="modal-title">
        <span>Delete Task?</span>
        <button id="cancelDelete" class="modal-close-btn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <p class="text-sm text-slate-400 mb-6">This action cannot be undone. The task will be permanently removed.</p>
      <div class="flex justify-end gap-2">
        <button id="cancelDeleteBtn" class="btn-cancel">Cancel</button>
        <button id="confirmDelete" class="btn-danger">Delete Task</button>
      </div>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
